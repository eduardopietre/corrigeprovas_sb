[tool:pytest]
# Configuração do pytest para o Worker

# Diretórios de teste
testpaths = tests

# Padrões de arquivos de teste
python_files = test_*.py *_test.py

# Padrões de classes e funções de teste
python_classes = Test*
python_functions = test_*

# Marcadores personalizados
markers =
    slow: marca testes que demoram para executar
    integration: marca testes de integração que precisam de Supabase local
    unit: marca testes unitários rápidos
    property: marca testes de propriedade (hypothesis)

# Opções padrão
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Configuração de cobertura (se pytest-cov estiver instalado)
# addopts = --cov=worker --cov-report=term-missing --cov-report=html

# Timeout para testes (se pytest-timeout estiver instalado)
# timeout = 300

# Configuração para testes paralelos (se pytest-xdist estiver instalado)
# addopts = -n auto